name: Check Resource Pack

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 资源包检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout editor
        uses: actions/checkout@v7
        with:
          repository: MetaMystia/MetaMystia-ResourceEx-Editor
          path: .editor
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check
        run: |
          mkdir -p check-report
          node .editor/scripts/checkResourcePack.ts . --report check-report/report.md

      # 供 comment-check-resource.yml 在 PR 中发布结果。
      - name: Save PR number
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > check-report/pr-number

      - name: Upload report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: resource-pack-check
          path: check-report/
          if-no-files-found: ignore
          retention-days: 7
